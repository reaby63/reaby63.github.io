<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切版雛形</title>
    <link rel="stylesheet" href="styles/css/style.css">
    <!-- bootstrap套用 -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <!-- Swiper套用 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
    <script>
        let siteData = {};

        // 載入 data.json
        fetch('./js/data.json')
            .then(res => res.json())
            .then(data => {

                siteData = data;

                loadLayouts();
                // 初始頁面只載入一次
                loadPage('page-home');

            });


        // 載入 Header / Footer
        function loadLayouts() {

            const layouts = [
                { file: 'layout/Header.html', id: 'header' },
                { file: 'layout/Footer.html', id: 'footer' }
            ];

            layouts.forEach(layout => {

                fetch(layout.file)
                    .then(res => res.text())
                    .then(html => {

                        html = replaceVars(html, siteData);

                        document.getElementById(layout.id).innerHTML = html;

                    })
                    .catch(err => console.error(`載入 ${layout.file} 失敗`, err));

            });

        }


        // 取得 {{ site.company }} 這種資料
        function getValue(obj, path) {

            return path
                .split('.')
                .reduce((value, key) => value?.[key], obj);

        }


        // 替換data.json裡的 {{ site.company }} 這種資料 但最多五層
        function replaceVars(str, data) {
            if (!str) return '';
            let result = str;
            // ==========================================
            // ① 處理 {{#each xxx}} ... {{/each}}
            // ==========================================
            const eachRegex =
                /\{\{#each\s+([\w.]+)\s*\}\}([\s\S]*?)\{\{\/each\}\}/g;
            result = result.replace(eachRegex, (_, path, template) => {

                const list = getValue(data, path);

                if (!Array.isArray(list)) {
                    return '';
                }

                return list.map(item => {

                    return replaceVars(template, item);

                }).join('');

            });
            // ==========================================
            // ② 處理一般 {{ xxx }}
            // ==========================================
            for (let i = 0; i < 5; i++) {
                const newResult = result.replace(
                    /\{\{\s*(.*?)\s*\}\}/g,
                    (_, key) => {

                        return getValue(data, key.trim()) ?? '';

                    }
                );
                if (newResult === result) {
                    break;
                }
                result = newResult;
            }
            return result;
        }
    </script>
</head>
<body>
    <div id="header"></div>
    
    <main id="main-content">
        <!-- 內容 -->
    </main>
    
    <div id="footer"></div>
    
    <!-- 彈窗內容 -->
    <div id="modal_container"></div>
</body>
<script src="js/jquery-3.7.1.min.js"></script>

<script src="./js/layout/header.js"></script>
