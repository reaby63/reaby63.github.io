<!-- data-radius : 圓圈半徑
data-speed : 旋轉速度 (數字越大越慢)
data-direction : 旋轉方向 (normal:順時針, reverse:逆時針)
data-hover-pause : 滑鼠移入是否暫停 (true:暫停, false:不暫停)
data-start : 開始角度 -->

<div class="circle-text"
     data-radius="120"
     data-speed="15"

</div>
