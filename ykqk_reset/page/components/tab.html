<!-- Tab 切換元件 -->
<!-- data-default : 預設開啟哪個 Tab
    data-tab : 按鈕對應的內容編號
    data-content : 內容區編號  -->

<div class="tabs" data-default="1">

    <div class="tab-buttons">
        <button class="tab-button active" data-tab="1">
            產品介紹
        </button>
        <button class="tab-button" data-tab="2">
            規格
        </button>
    </div>

    <div class="tab-content active" data-content="1">
        產品介紹內容
    </div>

    <div class="tab-content" data-content="2">
        規格內容
    </div>

</div>
