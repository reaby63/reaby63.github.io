<div>
    <!-- Swiper -->
    <!-- data-source 資料來源分類 - 第一層 key
    data-template html 吃的資料模板 (類似react寫法)
    data-key 資料來源分類 - 第二層 key
    data-loop 是否循環播放
    data-effect 切換效果 slide/fade/cube/coverflow/flip
    data-slide-group 一次顯示幾張 但也一次滑動這個數量的張數
    data-slides-per-view 一次顯示幾張 也可以寫auto
    data-space-between 每張卡片間距(px)
    data-autoplay 是否自動播放
    data-pagination
        data-pagination="bullet"      // 小圓點
        data-pagination="fraction"    // 1 / 5
        data-pagination="number"      // 1 2 3 4
        data-pagination="progressbar" // 進度條
        data-pagination="false"       // 關閉
    data-navigation 是否顯示左右箭頭
    data-scrollbar 是否顯示拖曳滾動條 -->
    <div 
        class="swiper mySwiper"
        data-source="banner"
        data-template="banner"
        data-key="one"
        data-effect="slide"
        data-loop="true"
        data-autoplay="true"
        data-pagination="true"
        data-navigation="true"
        data-scrollbar="true">
            <div class="swiper-wrapper swiper-slides">
        </div>

        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

        <!-- 滾動條 -->
        <div class="swiper-scrollbar"></div>
    </div>

    <div class="about" id="about">
        滑動第一區塊
    </div>

    <div class="product" id="product">
        滑動第二區塊
    </div>

    <div class="contact" id="contact">
        滑動第三區塊
    </div>
        
</div>
